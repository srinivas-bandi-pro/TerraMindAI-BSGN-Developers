services:
  agrismart:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or the environment}
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/database/agrismart.db}
      MODEL_PATH: ${MODEL_PATH:-/app/models}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-5000}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public application origin}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      LOG_TO_FILE: "false"
    ports:
      - "${HOST_PORT:-5000}:${PORT:-5000}"
    volumes:
      - agrismart_database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agrismart_database:
