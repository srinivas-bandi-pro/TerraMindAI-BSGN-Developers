{% extends 'base.html' %}
{% block title %}Change Password | TerraMind AI{% endblock %}
{% block content %}
<section class="profile-page"><div class="profile-card"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password</h1><form class="auth-form app-auth-form" method="post"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label><button class="button button--primary" type="submit">Update password</button></form></div></section>
{% endblock %}
